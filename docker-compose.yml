services:
  postgres:
    image: postgres:16-alpine
    container_name: classroom-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: classroom
    ports:
      - "5432:5432"
    volumes:
      - classroom_pgdata:/var/lib/postgresql/data

volumes:
  classroom_pgdata:
